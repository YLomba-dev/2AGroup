<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3a5f">
  <title>Sign in · 2A Group Corp</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card card">
    <div class="auth-brand">2A GROUP CORP</div>
    <p class="muted small" id="subtitle">Immigration case portal</p>

    <form id="signin" class="grid">
      <h1>Sign in</h1>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="primary block" type="submit">Sign in</button>
      <div class="row small"><button type="button" class="link" id="magic">Email me a sign-in link</button><span class="muted">·</span><button type="button" class="link" id="forgot">Forgot password</button></div>
    </form>

    <form id="setpw" class="grid" hidden>
      <h1>Choose your password</h1>
      <p class="small muted">At least 10 characters, with upper-case and lower-case letters and a number.</p>
      <div class="field"><label for="pw1">New password</label><input id="pw1" type="password" autocomplete="new-password" minlength="10" required></div>
      <div class="field"><label for="pw2">Repeat it</label><input id="pw2" type="password" autocomplete="new-password" minlength="10" required></div>
      <button class="primary block" type="submit">Save and continue</button>
    </form>

    <form id="mfa" class="grid" hidden>
      <h1>Two-step verification</h1>
      <p class="small muted">Enter the 6-digit code from your authenticator app.</p>
      <div class="field"><label for="code">Code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
      <button class="primary block" type="submit">Verify</button>
    </form>

    <div id="notice" class="notice info" hidden></div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
